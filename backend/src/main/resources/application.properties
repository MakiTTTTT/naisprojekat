# Spring Boot Application Properties

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=semantic-movie-search

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/moviesdb
spring.datasource.username=movieuser
spring.datasource.password=moviepass123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL95Dialect

# Logging
logging.level.root=INFO
logging.level.com.moviex=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Qdrant Configuration
qdrant.host=qdrant
qdrant.port=6333

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
